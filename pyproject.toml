[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta-rest-ws"
version = "0.1.0"
description = "Python SDK for the Delta Exchange REST and WebSocket APIs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Delta Exchange SDK contributors"}]
keywords = ["delta-exchange", "cryptocurrency", "trading", "rest", "websocket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.28,<3",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Documentation = "https://docs.delta.exchange"
Homepage = "https://www.delta.exchange"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_rest_ws"]

[tool.hatch.build.targets.sdist]
include = ["src/delta_rest_ws", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
